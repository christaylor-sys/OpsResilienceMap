<title>Resilience portfolio – hazard score map</title>

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1d2a33;--muted:#5d6b75;--line:#d5dbe0;--panel:#ffffffee;}
  html,body{height:100%;margin:0;font-family:"Public Sans",system-ui,sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0}
  .panel{position:absolute;z-index:1000;top:12px;left:56px;width:290px;max-height:calc(100% - 24px);overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;box-sizing:border-box;font-size:13px;line-height:1.45}
  .panel h1{font-size:17px;margin:0 0 2px;font-weight:700}
  .panel p{margin:0 0 10px;color:var(--muted)}
  .seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin:6px 0 12px}
  .seg button{flex:1;border:0;background:#fff;padding:7px 4px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}
  .seg button[aria-pressed=true]{background:var(--ink);color:#fff;font-weight:600}
  .seg button:focus-visible,.flag button:focus-visible{outline:2px solid #2a7de1;outline-offset:1px}
  .ramp{height:12px;border-radius:3px;background:linear-gradient(90deg,#1a9850,#ffd700 50%,#d73027)}
  .ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:3px}
  .stats{margin:12px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
  .stats b{font-weight:600}
  h2{font-size:13px;margin:14px 0 6px;font-weight:600}
  .flag button{display:block;width:100%;text-align:left;background:#fff6e5;border:1px solid #f0d9a8;border-radius:4px;
    padding:6px 8px;margin:0 0 6px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}
  .leaflet-popup-content{font-family:"Public Sans",system-ui,sans-serif;font-size:13px;margin:12px 14px}
  .pop-site{padding:6px 0;border-top:1px solid var(--line)}
  .pop-site:first-of-type{border-top:0;padding-top:0}
  .pop-site .nm{font-weight:600}
  .pill{display:inline-block;padding:0 6px;border-radius:3px;font-weight:600;color:#1d2a33}
  .warn{color:#9a5b00;font-size:12px;margin-top:3px}
  @media (max-width:600px){.panel{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:45%}}
</style>
</head>

  <p>72 locations coloured by hazard score. Click a dot for details.</p>

  <div class="stats" id="stats"></div>

// Same basemap as the uploaded index.html (CARTO Positron via Leaflet 1.9.3)
const map = L.map('map',{zoomControl:true,worldCopyJump:true}).setView([40,20],3);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  maxZoom:20,subdomains:'abcd',
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);

// 0 = green, 5 = yellow, 10 = red
function colour(v){
  v=Math.max(0,Math.min(10,v));
  const g=[26,152,80], y=[255,215,0], r=[215,48,39];
  const [a,b,t]= v<=5 ? [g,y,v/5] : [y,r,(v-5)/5];
  const c=a.map((x,i)=>Math.round(x+(b[i]-x)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

// Group sites sharing identical coordinates so none are hidden underneath another
const groups={};
DATA.forEach(d=>{const k=d.lat.toFixed(6)+','+d.lon.toFixed(6);(groups[k]=groups[k]||[]).push(d);});

let mode='top';
const layer=L.layerGroup().addTo(map);
const markers={};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function popupHtml(g){
  return g.slice().sort((a,b)=>b[mode]-a[mode]).map(d=>`
    <div class="pop-site">
      <div class="nm">${esc(d.company)}</div>
      <div>${esc(d.place)}</div>
      <div>Top hazard: <span class="pill" style="background:${colour(d.top)}">${d.top}</span> ${d.haz?esc(d.haz):'<i>not labelled in source</i>'}</div>
      <div>Aggregate: <span class="pill" style="background:${colour(d.agg)}">${d.agg}</span></div>
      <div style="color:#5d6b75">${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}</div>
    </div>`).join('');
}

function draw(){
  layer.clearLayers();
  // draw low scores first so high-risk dots sit on top
  Object.entries(groups).map(([k,g])=>[k,g,Math.max(...g.map(d=>d[mode]))])
    .sort((a,b)=>a[2]-b[2]).forEach(([k,g,v])=>{
      const m=L.circleMarker([g[0].lat,g[0].lon],{
        radius:g.length>1?7:6,color:'#1d2a33',weight:g.length>1?1.5:0.8,
        fillColor:colour(v),fillOpacity:0.92
      }).bindPopup(popupHtml(g),{maxWidth:300,maxHeight:320})
        .bindTooltip(g.length>1?`${[...new Set(g.map(d=>d.company))].join(', ')} · max ${v}`:`${g[0].company} · ${v}`,{direction:'top',offset:[0,-6]});
      layer.addLayer(m); g.forEach(d=>markers[d.id]=m);
    });
  const vals=DATA.map(d=>d[mode]);
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const hi=DATA.reduce((a,b)=>b[mode]>a[mode]?b:a);
  document.getElementById('stats').innerHTML=
    `<span>Sites</span><b>${DATA.length}</b><span>Mean</span><b>${mean.toFixed(2)}</b>
     <span>Highest</span><b>${hi[mode]} (${esc(hi.company)})</b><span>Score ≥ 5</span><b>${vals.filter(v=>v>=5).length}</b>`;
}

function setMode(m){
  mode=m;
  document.getElementById('bTop').setAttribute('aria-pressed',m==='top');
  document.getElementById('bAgg').setAttribute('aria-pressed',m==='agg');
  draw();
}
document.getElementById('bTop').onclick=()=>setMode('top');
document.getElementById('bAgg').onclick=()=>setMode('agg');


draw();
map.fitBounds(DATA.map(d=>[d.lat,d.lon]),{padding:[30,30]});
</script>
